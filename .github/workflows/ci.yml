name: CI

on:
  push:
    branches: ["**"]
  pull_request:

permissions:
  contents: read

env:
  # Qt is a dev dependency now, so the Qt-level tests run headless instead of
  # being skipped.
  QT_QPA_PLATFORM: offscreen

jobs:
  test:
    name: tests (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]

    steps:
      - uses: actions/checkout@v4

      # The manylinux PyQt6 wheel needs these system libraries even when Qt
      # runs on the offscreen platform.
      - name: Install Qt runtime libraries (Linux)
        if: matrix.os == 'ubuntu-latest'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libegl1 libgl1 libxkbcommon0 libfontconfig1 libdbus-1-3

      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Install dependencies
        run: uv sync

      - name: Run tests
        run: uv run pytest -q

      - name: Build the plugin archive
        run: uv run python tools/build_plugin_zip.py

      - name: Build the diagnostics dev plugin archive
        run: uv run python tools/build_plugin_zip.py --plugin grid_diagnostics

      - uses: actions/upload-artifact@v4
        with:
          name: plugin-zip-${{ matrix.os }}
          path: dist/*.zip
          if-no-files-found: error
