[project]
name = "krita_composition_grid"
version = "0.1.0"
description = "Composition grid overlay plugin for Krita 5.3+"
requires-python = ">=3.10"
license = "GPL-3.0-or-later"
license-files = ["LICENSE"]

[tool.uv]
dev-dependencies = [
    "pyqt6>=6.12.0",
    "pytest",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
